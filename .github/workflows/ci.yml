name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo PR cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Banco descartável para os testes de integração (trava de resgate, rollback, Filtros);
    # mesma versão do ambiente de desenvolvimento (previna-development)
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: previna_test
          POSTGRES_USER: previna
          POSTGRES_PASSWORD: previna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U previna -d previna_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PREVINA_TEST_DB_URL: jdbc:postgresql://localhost:5432/previna_test
      DB_USER: previna
      DB_PASSWORD: previna

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify roda os testes e falha se a cobertura (JaCoCo) ficar abaixo do piso do pom.xml
      - name: Testes
        run: mvn -B -ntp verify

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-backend
          path: target/surefire-reports/

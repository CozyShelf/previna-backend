spring:
  application:
    name: previna-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/previna}
    username: ${DB_USER:previna}
    password: ${DB_PASSWORD:previna}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  # Padrão: MailHog do ambiente de desenvolvimento (previna-development)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    # Sem timeout o envio travaria a requisição (e a transação) se o SMTP não responder
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

previna:
  security:
    jwt:
      secret: ${JWT_SECRET:troque-este-segredo-em-producao-com-no-minimo-32-bytes}
      expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:60}
      # Sessão do app mobile fica salva no celular
      expiracao-gestante-dias: ${JWT_EXPIRACAO_GESTANTE_DIAS:30}
  email:
    remetente: ${MAIL_FROM:Previna <nao-responda@previna.com.br>}
    # Vai no e-mail de pré-login da empresa parceira
    url-portal: ${PORTAL_URL:http://localhost}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.cozyshelf.previna: DEBUG
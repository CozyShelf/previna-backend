spring:
  application:
    name: previna-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/previna}
    username: ${DB_USER:previna}
    password: ${DB_PASSWORD:previna}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

previna:
  security:
    jwt:
      secret: ${JWT_SECRET:troque-este-segredo-em-producao-com-no-minimo-32-bytes}
      expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:480}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.cozyshelf.previna: DEBUG